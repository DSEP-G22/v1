name: CI

# Tests and type checks on every push and pull request. The suite runs under APP_PROFILE=stub,
# which forces every *_impl to a stub (libs/platform/config.py::_STUB_IMPL_FIELDS) so CI never
# reaches Ollama, the HuggingFace hub, or a GPU. That is what makes this job hermetic.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      APP_PROFILE: stub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        # No [tool.ruff] section in pyproject.toml, so the rule set is given explicitly. It is
        # scoped to correctness rather than formatting: F (pyflakes: undefined names, unused
        # imports and locals) plus E7/E9 (syntax and ambiguous-name errors). E501 line-length and
        # I001 import ordering are deliberately excluded — the existing tree has ~40 such
        # findings, and failing CI on pre-existing formatting would make the gate noise rather
        # than signal. Widen this once the tree is formatted.
        run: ruff check --select F,E7,E9 --line-length 120 libs services runtime evaluation scripts

      - name: Test
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck and build
        # `npm run build` is `tsc -b && vite build`, so this covers type errors and the bundle in
        # one step. There is no eslint config in the repo, so `npm run lint` is deliberately not
        # wired up here — it would fail on a missing config, not on real problems.
        run: npm run build
