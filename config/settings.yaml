# Profile overrides. Precedence, low to high:
#   Settings field defaults  <  this file's profile block  <  environment / .env
#   <  the stub-profile force override in libs/platform/config.py
#
# The stub profile is not listed here. It is defined in code (_STUB_IMPL_FIELDS) precisely so that
# CI cannot be broken by editing a YAML file: the stub profile must never reach the network or a
# GPU regardless of what this file says.

profiles:

  # Local development against real models. Ollama must be running; models degrade to rules if it
  # is not, so this profile still starts without it.
  cpu:
    # The frozen-embedding student, not the fine-tuned one, is the default.
    #
    # It is the cheaper of the two and the difference is not currently paid for: on the 958/240
    # split it reaches department accuracy 0.838 and macro-F1 0.711 at roughly 10 ms per ticket,
    # while fitting in seconds rather than minutes. Retraining cost is what the continuous
    # learning loop pays repeatedly, so it dominates the choice.
    #
    # Switch to `distilled` once the fine-tuned student is measured to beat this on macro-F1 by
    # a margin that justifies its training cost, and once the telecom departments have enough
    # rows to make that comparison meaningful (see docs/17-llm-triage-distillation.md).
    triage_model_impl: embedding

    # Response generation is a real LLM call. The default llama3.1:8b-instruct-q4_K_M was never
    # successfully pulled on this machine, and OllamaGenerator degrades quietly to a templated
    # reply when its model is missing, so the pipeline would have looked healthy while generating
    # nothing model-written. A cloud model needs no pull and uses the same endpoint.
    llm_model: gpt-oss:120b-cloud

  # Full stack: Kafka, Postgres, and the same real models as the cpu profile.
  full:
    triage_model_impl: embedding
    llm_model: gpt-oss:120b-cloud
    broker: kafka
