name: Build images

# Builds the two deployable images (docker/Dockerfile.api, docker/Dockerfile.ui) and pushes them
# to GHCR. Pull requests build but do not push, so a fork cannot publish under this repository's
# namespace; pushes to main and tags publish.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # The API image is built from the repository root: its Dockerfile COPYs libs/, services/
          # and runtime/, which live above frontend/.
          - service: api
            dockerfile: docker/Dockerfile.api
            context: .
          # The UI image builds from frontend/ because its Dockerfile does `COPY package.json`
          # and `COPY . .` relative to that directory.
          - service: ui
            dockerfile: docker/Dockerfile.ui
            context: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Skipped on pull requests: GITHUB_TOKEN is read-only for forks, and nothing is pushed.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache lives in the Actions cache rather than the registry, so pull-request
          # builds (which never log in) still get warm caches.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
